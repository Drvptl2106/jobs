<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Job Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell. Top bar with search, job feed of cards, full-screen job sheet, bottom tab bar on phones. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --ink: #121a17; --muted: #5d6b66; --line: #e1e6e3;
  --accent: #10805a; --accent-ink: #ffffff; --accent-soft: #e3f2ec;
  --good: #1f7a3d; --good-soft: #e3f3e7; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --bad: #a3322a; --bad-soft: #f9e4e1; --info: #2f4f8a; --info-soft: #e7ecf7;
  --shadow: 0 1px 2px rgba(18, 26, 23, .06), 0 2px 8px rgba(18, 26, 23, .04);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px; --nav-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1412; --surface: #161e1b; --ink: #e6ece9; --muted: #98a7a1; --line: #26312d;
  --accent: #4cc39a; --accent-ink: #08110d; --accent-soft: #17302a;
  --good: #73d08f; --good-soft: #1a2f21; --warn: #e6b65c; --warn-soft: #33290f;
  --bad: #f08c80; --bad-soft: #3a1d1a; --info: #9db6ec; --info-soft: #1c2640;
  --shadow: none; color-scheme: dark } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
a { color: var(--accent); }
button, .btn { font: 600 0.9rem var(--body); border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px; height: 40px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { padding-block: 12px; display: grid; gap: 10px; }
.titlerow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.right { display: flex; align-items: center; gap: 8px; }
.iconbtn { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
.iconbtn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
h1 { font-family: var(--display); font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
.stamp { font-size: 0.78rem; color: var(--muted); text-align: right; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; height: 44px; }
.search svg { flex: none; color: var(--muted); }
.search input { border: 0; background: transparent; color: var(--ink); font: 400 0.95rem var(--body); width: 100%; outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 32px; padding: 0 12px; font-size: 0.82rem; font-weight: 500; border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

main { padding-block: 14px 24px; display: grid; gap: 12px; }
main > *, #view { min-width: 0; }
#view { display: grid; gap: 12px; }
.notice { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--r); padding: 10px 14px; font-size: 0.88rem; }
.notice b { color: var(--warn); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; }
.section-head h2 { font-family: var(--display); font-size: 1.05rem; margin: 0; }
.section-head span { font-size: 0.82rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }

/* Job cards */
.feed { display: grid; gap: 10px; }
.card { align-items: start; white-space: normal; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; height: auto; }
.card:hover { border-color: var(--accent); }
.swipe { position: relative; border-radius: var(--r); }
.swipe::before { content: "Skip ✕"; position: absolute; inset: 0; border-radius: var(--r); background: var(--bad-soft); color: var(--bad); font-weight: 600; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; }
.swipe .card { position: relative; touch-action: pan-y; transition: transform .18s ease, opacity .18s ease; }
.swipe .card.dragging { transition: none; }
.hint { font-size: 0.8rem; color: var(--muted); }
.sync { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--info-soft); border: 1px solid var(--info); border-radius: var(--r); padding: 10px 14px; font-size: 0.88rem; }
.sync .btn { height: 34px; }
.cardrow { display: grid; gap: 6px; }
.restore { justify-self: start; height: 34px; }
.breakdown { display: grid; gap: 10px; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.crit b { font-weight: 600; font-size: 0.9rem; }
.crit .pts { font: 500 0.85rem var(--mono); }
.crit .bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.crit .bar i { display: block; height: 100%; }
.crit small { grid-column: 1 / -1; color: var(--muted); font-size: 0.82rem; }
.conf { font-size: 0.8rem; color: var(--muted); }
.logo { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font: 700 1rem var(--display); color: #fff; }
.card .co { display: flex; align-items: center; gap: 6px; font-size: 0.84rem; color: var(--muted); min-width: 0; }
.card .co span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fit { font-family: var(--mono); font-size: 0.78rem; color: var(--ink); flex: none; }
.fit::before { content: "● "; color: var(--fitc, var(--muted)); }
.card .t { font-family: var(--display); font-weight: 700; font-size: 1.05rem; line-height: 1.25; margin: 2px 0; overflow-wrap: anywhere; }
.card .loc { font-size: 0.86rem; color: var(--muted); }
.card .pay { font-size: 0.86rem; font-weight: 500; }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.tag { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.age { margin-left: auto; font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.age.fresh { color: var(--accent); font-weight: 600; }

/* Tracker table */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 0.86rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.status { font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; background: var(--info-soft); color: var(--info); border: 0; height: auto; }
.s-interview, .s-offer { background: var(--good-soft); color: var(--good); }
.s-rejected, .s-withdrawn { background: var(--bad-soft); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats .tile { height: auto; border-radius: var(--r); padding: 8px 10px; display: block; text-align: left; white-space: normal; }
.stats .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stats b { display: block; font: 500 1.25rem var(--mono); }
.tcards { display: none; gap: 10px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 3px; box-shadow: var(--shadow); }
.tc-top { display: flex; align-items: center; gap: 8px; }
.tc-n { font: 500 0.8rem var(--mono); color: var(--muted); }
.tc-date { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
.tc-co { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.tc-role { font-family: var(--display); font-weight: 700; font-size: 1.02rem; line-height: 1.25; color: var(--ink); text-decoration: none; }
.tc-meta { font-size: 0.84rem; color: var(--muted); }
.tc-act { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 0.84rem; font-weight: 500; }
@media (max-width: 700px) { .tcards { display: grid; } .tablewrap { display: none; } .stats span { font-size: 0.64rem; } }
.stats span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

/* Job sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.sheet-top { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.sheet-top .wrap { display: flex; align-items: center; gap: 8px; height: 52px; }
.back { border: 0; background: transparent; padding: 0 8px; height: 40px; }
.sheet-top .ttl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero .wrap { padding-block: 16px; display: grid; gap: 6px; }
.hero .logo { width: 52px; height: 52px; font-size: 1.15rem; }
.hero h2 { font-family: var(--display); font-size: 1.4rem; line-height: 1.2; margin: 6px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.hero .co { color: var(--muted); }
.hero .pay { font-weight: 600; }
.scorebar { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.meter { flex: 1; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--fitc, var(--accent)); }
.scorebar b { font: 500 1rem var(--mono); }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs .wrap { display: flex; gap: 22px; overflow-x: auto; }
.tab { border: 0; border-radius: 0; background: transparent; height: 46px; padding: 0 2px; color: var(--muted); border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding-block: 16px; display: grid; gap: 14px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.box h3 { margin: 0 0 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.box ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.box.pro h3 { color: var(--good); }
.box.con h3 { color: var(--bad); }
.jd { white-space: pre-line; font-size: 0.93rem; max-width: 70ch; }
.checks { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.check .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; }
.check b { display: block; }
.check small { color: var(--muted); }
.d-good { background: var(--good-soft); color: var(--good); }
.d-warn { background: var(--warn-soft); color: var(--warn); }
.d-bad { background: var(--bad-soft); color: var(--bad); }
.d-unk { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar .wrap { display: flex; gap: 10px; padding-block: 12px; }
.actionbar .btn { flex: 1; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }

/* Bottom nav */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.bottom .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
nav.bottom button { border: 0; border-radius: 0; background: transparent; height: 100%; flex-direction: column; gap: 2px; font-size: 0.72rem; font-weight: 500; color: var(--muted); padding: 0; }
nav.bottom button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.bottom svg { width: 22px; height: 22px; }
.badge { font-family: var(--mono); font-size: 0.68rem; }
.toast button { margin-left: 12px; height: 28px; padding: 0 10px; background: transparent; color: inherit; border-color: currentColor; }
.toast { display: flex; align-items: center; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.88rem; z-index: 40; width: max-content; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(12px); opacity: .6; } } }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="titlerow"><h1>Job Desk</h1><div class="right"><div class="stamp" id="stamp">Loading…</div><button class="iconbtn" id="refresh" aria-label="Refresh" title="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></div></div>
  <label class="search" for="q">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search company, role or city" autocomplete="off">
  </label>
  <div class="chips" id="chips" role="group" aria-label="Filters">
    <button class="chip" data-f="apply" aria-pressed="false">Worth applying</button>
    <button class="chip" data-f="sponsor" aria-pressed="false">Licensed sponsor</button>
    <button class="chip" data-f="salary" aria-pressed="false">Salary meets visa</button>
    <button class="chip" data-f="direct" aria-pressed="false">Direct employer</button>
    <button class="chip" data-f="easy" aria-pressed="false">Easy Apply</button>
  </div>
</div></header>

<div class="wrap"><main id="main">
  <div class="notice" id="notice" hidden></div>
  <div id="view"><div class="empty">Loading your jobs…</div></div>
</main></div>

<nav class="bottom" aria-label="Sections"><div class="wrap">
  <button data-v="jobs" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Jobs <span class="badge" id="b-jobs"></span></button>
  <button data-v="cvs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>CVs <span class="badge" id="b-cvs"></span></button>
  <button data-v="tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Tracker <span class="badge" id="b-tracker"></span></button>
  <button data-v="skipped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h18M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7M9 7V4h6v3"/></svg>Skipped <span class="badge" id="b-skipped"></span></button>
</div></nav>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const state = { local: load("jd-local", { skip: {}, restore: {} }), tfilter: "all", jobs: [], meta: {}, cfg: {}, view: load("jd-view", "jobs"), filters: new Set(), q: "", pending: load("jd-pending", {}), tab: "analysis" };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = (m, undo) => {
    const t = $("#toast"); t.innerHTML = `<span>${esc(m)}</span>${undo ? `<button type="button">Undo</button>` : ""}`; t.hidden = false;
    if (undo) t.querySelector("button").onclick = () => { undo(); t.hidden = true; };
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), undo ? 6000 : 4200);
  };
  const time12 = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true }).replace(/\b(am|pm)\b/i, (x) => x.toUpperCase()); };
  const fmtDate = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
  const isFresh = (a) => /just posted|^\s*(\d{1,2}h|24h|1d)\s*$/i.test(a || "");
  const APPLIED = ["applied", "interview", "offer", "rejected", "withdrawn"];
  const isSkipped = (j) => j.decision === "skipped" || j.status === "skipped" || j.status === "expired";
  const bucket = (j) => APPLIED.includes(j.status) ? "tracker"
    : state.local.skip[j.id] && !isSkipped(j) ? "skipped"
    : state.local.restore[j.id] && isSkipped(j) ? "jobs"
    : APPLIED.includes(j.status) ? "tracker"
    : (j.decision === "skipped" || j.status === "skipped" || j.status === "expired") ? "skipped"
    : (j.decision === "approved" || j.status === "approved" || j.status === "cv_ready") ? "cvs" : "jobs";

  const PALETTE = ["#10805a", "#2f5fa8", "#8a4bb0", "#b5552b", "#2d7f8a", "#9a3e5e", "#5b6b1f", "#4a5568"];
  const logo = (name, cls = "") => {
    const words = String(name || "?").replace(/\(.*?\)/g, "").replace(/\b(ltd|limited|plc|llp|group|the|uk)\b/gi, "").trim().split(/\s+/);
    const ini = ((words[0] || "?")[0] + (words[1] ? words[1][0] : "")).toUpperCase();
    let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return `<div class="logo ${cls}" style="background:${PALETTE[h % PALETTE.length]}" aria-hidden="true">${esc(ini)}</div>`;
  };
  const fitColor = (s) => s == null ? "var(--muted)" : s >= 70 ? "var(--good)" : s >= 50 ? "var(--warn)" : "var(--bad)";
  const recLabel = { apply: "Worth applying", maybe: "Maybe", skip: "Probably skip" };

  function checks(j) {
    const m = j.sponsor_match && typeof j.sponsor_match === "object" ? j.sponsor_match : null;
    const reg = j.sponsor_register || "unknown";
    return [
      { k: "Home Office sponsor register", c: { licensed: "good", licensed_other_route: "warn", possible: "warn", not_found: "bad" }[reg] || "unk",
        v: { licensed: "Licensed Skilled Worker sponsor", licensed_other_route: "Licensed, but not for Skilled Worker", possible: "Possible match, check the name", not_found: "Not on the register", unknown: "Not checked yet" }[reg] || reg,
        d: m ? `${m.name}${m.town ? ", " + m.town : ""}${m.rating ? " · " + m.rating : ""}` : "" },
      { k: "What the advert says", c: { offers: "good", silent: "warn", no_sponsorship: "bad", right_to_work_required: "bad" }[j.jd_sponsorship] || "unk",
        v: { offers: "Mentions visa sponsorship", silent: "Doesn't mention sponsorship", no_sponsorship: "Says no sponsorship", right_to_work_required: "Needs existing right to work" }[j.jd_sponsorship] || "Advert not read", d: "" },
      { k: "Salary vs Skilled Worker threshold", c: { meets_general: "good", range_crosses_general: "good", meets_new_entrant: "good", range_crosses_new_entrant: "warn", below_threshold: "bad" }[j.salary_check] || "unk",
        v: { meets_general: "Meets £41,700 general threshold", range_crosses_general: "Top of range reaches £41,700", meets_new_entrant: "Meets £33,400 new-entrant rate", range_crosses_new_entrant: "Only the top of the range reaches £33,400", below_threshold: "Below £33,400 new-entrant rate" }[j.salary_check] || "No salary given", d: j.salary || "" },
      { k: "Who posted it", c: j.recruiter ? "warn" : "good", v: j.recruiter ? "Recruitment agency" : "Direct employer", d: j.recruiter ? "The real employer may be hidden; ask the recruiter about sponsorship." : "" },
    ];
  }
  const tagFor = (j) => {
    const c = checks(j)[0];
    return c.c === "good" ? `<span class="tag good">Sponsor licence</span>` : c.c === "bad" ? `<span class="tag bad">No sponsor licence</span>` : c.c === "warn" ? `<span class="tag warn">Check sponsor</span>` : "";
  };

  function issueUrl(verb, j) {
    const g = state.cfg.github || {};
    const body = `${j.title} at ${j.company}\n\nTap "Submit new issue" to record this. A GitHub Action updates the tracker and closes this issue within a minute.`;
    return `https://github.com/${encodeURIComponent(g.owner || "")}/${encodeURIComponent(g.repo || "")}/issues/new?title=${encodeURIComponent(`job-desk: ${verb} ${j.id}`)}&body=${encodeURIComponent(body)}`;
  }
  const act = (verb, j, label, cls = "") => `<a class="btn ${cls}" href="${esc(issueUrl(verb, j))}" target="_blank" rel="noopener" data-verb="${verb}" data-id="${esc(j.id)}">${label}</a>`;
  const chatUrl = (j) => {
    const p = `I'm looking at this job and want to talk it through before you tailor my CV.\n\n${j.title} at ${j.company} (${j.location || ""})\n${j.url || ""}\nJob id: ${j.id}\n\nUse my Job Desk repo (${(state.cfg.github || {}).owner}/${(state.cfg.github || {}).repo}): read CLAUDE.md, cv/master_cv.md and this job in data/jobs.csv.`;
    return "https://claude.ai/new?q=" + encodeURIComponent(p);
  };

  const saveLocal = () => save("jd-local", state.local);
  function skipLocal(id) {
    const j = state.jobs.find((x) => x.id === id); if (!j) return;
    if (state.local.restore[id]) delete state.local.restore[id]; else state.local.skip[id] = Date.now();
    saveLocal(); render(); if (!$("#sheet").hidden) history.back();
    toast(`Skipped ${j.company}`, () => { delete state.local.skip[id]; if (isSkipped(j)) state.local.restore[id] = Date.now(); saveLocal(); render(); });
  }
  function restoreLocal(id) {
    const j = state.jobs.find((x) => x.id === id); if (!j) return;
    if (state.local.skip[id]) delete state.local.skip[id]; else state.local.restore[id] = Date.now();
    saveLocal(); render(); toast(`Moved ${j.company} back to Jobs`);
  }
  function batchUrl(verb, ids) {
    const g = state.cfg.github || {};
    const names = ids.map((id) => { const j = state.jobs.find((x) => x.id === id); return j ? `- ${j.title} at ${j.company}` : `- ${id}`; }).join("\n");
    const body = `${verb === "skip" ? "Skipped" : "Restored"} on Job Desk:\n${names}\n\nids: ${ids.join(",")}\n\nTap "Submit new issue" to save this. A GitHub Action records it and closes this issue within a minute.`;
    return `https://github.com/${encodeURIComponent(g.owner || "")}/${encodeURIComponent(g.repo || "")}/issues/new?title=${encodeURIComponent(`job-desk: ${verb} batch`)}&body=${encodeURIComponent(body)}`;
  }
  function syncBar() {
    const sk = Object.keys(state.local.skip), rs = Object.keys(state.local.restore);
    if (!sk.length && !rs.length) return "";
    const parts = [sk.length ? `${sk.length} skipped` : "", rs.length ? `${rs.length} restored` : ""].filter(Boolean).join(" and ");
    return `<div class="sync"><span>${parts} on this device only. Save to GitHub so it sticks everywhere.</span>
      ${sk.length ? `<a class="btn primary" href="${esc(batchUrl("skip", sk))}" target="_blank" rel="noopener" data-sync>Save skips</a>` : ""}
      ${rs.length ? `<a class="btn" href="${esc(batchUrl("reopen", rs))}" target="_blank" rel="noopener" data-sync>Save restores</a>` : ""}</div>`;
  }

  function matches(j) {
    if (state.q) {
      const hay = `${j.company} ${j.title} ${j.location}`.toLowerCase();
      if (!state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    const f = state.filters;
    if (f.has("apply") && j.recommendation !== "apply") return false;
    if (f.has("sponsor") && j.sponsor_register !== "licensed") return false;
    if (f.has("salary") && !["meets_general", "range_crosses_general", "meets_new_entrant"].includes(j.salary_check)) return false;
    if (f.has("direct") && j.recruiter) return false;
    if (f.has("easy") && !j.easy_apply) return false;
    return true;
  }

  function card(j) {
    const s = Number.isFinite(j.fit_score) ? j.fit_score : null;
    const p = state.pending[j.id];
    const b = bucket(j);
    const inner = `<div class="card" role="button" tabindex="0" data-open="${esc(j.id)}" aria-label="${esc(j.title)} at ${esc(j.company)}">
      ${logo(j.company)}
      <div style="min-width:0">
        <div class="co"><span>${esc(j.company)}</span>${s != null ? `<span class="fit" style="--fitc:${fitColor(s)}">${s} fit</span>` : ""}</div>
        <div class="t">${esc(j.title)}</div>
        <div class="loc">${esc(j.location || "")}</div>
        ${j.salary ? `<div class="pay">${esc(j.salary)}</div>` : ""}
        <div class="foot">${tagFor(j)}${j.easy_apply ? `<span class="tag">Easy Apply</span>` : ""}${j.status === "cv_ready" ? `<span class="tag info">CV ready</span>` : ""}${p ? `<span class="tag info">Sent: ${esc(p.verb)}</span>` : ""}
          <span class="age ${isFresh(j.posted_age) ? "fresh" : ""}">${esc(j.posted_age || "")}</span></div>
      </div></div>`;
    if (b === "jobs" || b === "cvs") return `<div class="swipe" data-swipe="${esc(j.id)}">${inner}</div>`;
    if (b === "skipped") return `<div class="cardrow">${inner}<button class="restore" data-restore="${esc(j.id)}">↩ Restore to Jobs</button></div>`;
    return inner;
  }

  function trackerView(list) {
    const numbered = list.slice().sort((a, b) => String(a.applied_at || a.status_updated_at).localeCompare(String(b.applied_at || b.status_updated_at)))
      .map((j, i) => ({ j, n: i + 1 }));
    const groups = { all: null, waiting: ["applied"], interviews: ["interview", "offer"], rejected: ["rejected", "withdrawn"] };
    const count = (k) => groups[k] ? list.filter((j) => groups[k].includes(j.status)).length : list.length;
    const f = state.tfilter;
    const rows = numbered.filter(({ j }) => !groups[f] || groups[f].includes(j.status));
    const next = { applied: ["interview", "rejected", "withdrawn"], interview: ["offer", "rejected", "withdrawn"], offer: ["withdrawn"] };
    const moves = (j) => (next[j.status] || []).map((s) => `<a href="${esc(issueUrl(s, j))}" target="_blank" rel="noopener" data-verb="${s}" data-id="${esc(j.id)}">→ ${s}</a>`).join("");
    const tile = (k, label) => `<button class="tile" data-tf="${k}" aria-pressed="${f === k}"><b>${count(k)}</b><span>${label}</span></button>`;
    const newestFirst = rows.slice().reverse();
    return `<div class="stats">${tile("all", "All")}${tile("waiting", "Waiting")}${tile("interviews", "Interviews")}${tile("rejected", "Rejected")}</div>
      <div class="tcards">${newestFirst.map(({ j, n }) => `<article class="tcard">
          <div class="tc-top"><span class="tc-n">#${n}</span><span class="status s-${esc(j.status)}">${esc(j.status)}</span><span class="tc-date">${j.applied_at ? fmtDate(j.applied_at) : "Date not known"}</span></div>
          <div class="tc-co">${esc(j.company)}</div>
          <a class="tc-role" href="#job/${esc(j.id)}">${esc(j.title)}</a>
          ${j.location || j.salary ? `<div class="tc-meta">${[j.location, j.salary].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
          ${j.last_email ? `<div class="tc-meta">✉ ${esc(j.last_email)}</div>` : ""}
          ${j.cv_url || moves(j) ? `<div class="tc-act">${j.cv_url ? `<a href="${esc(j.cv_url)}">CV used ↓</a>` : ""}${moves(j)}</div>` : ""}
        </article>`).join("") || `<div class="empty">Nothing in this group.</div>`}</div>
      <div class="tablewrap"><table><thead><tr><th>Sr No</th><th>Company Name</th><th>Role</th><th>Location</th><th>Applied On</th><th>Pay</th><th>CV Application</th><th>Status</th></tr></thead><tbody>
      ${rows.map(({ j, n }) => `<tr><td class="num">${n}</td><td>${esc(j.company)}</td><td><a href="#job/${esc(j.id)}">${esc(j.title)}</a></td><td>${esc(j.location || "—")}</td>
        <td>${j.applied_at ? fmtDate(j.applied_at) : "—"}</td><td>${esc(j.salary || "—")}</td>
        <td>${j.cv_url ? `<a href="${esc(j.cv_url)}">Download</a>` : "—"}</td>
        <td><span class="status s-${esc(j.status)}">${esc(j.status)}</span>${moves(j) ? `<div class="links tc-act" style="margin-top:6px">${moves(j)}</div>` : ""}</td></tr>`).join("")}
      </tbody></table></div>
      <p style="font-size:.8rem;color:var(--muted);margin:0">Also on GitHub as <a href="data/applied.csv">applied.csv</a>. Claude updates statuses from your Gmail each morning.</p>`;
  }

  function render() {
    const groups = { jobs: [], cvs: [], tracker: [], skipped: [] };
    for (const j of state.jobs) groups[bucket(j)].push(j);
    for (const k in groups) $("#b-" + k).textContent = groups[k].length ? `(${groups[k].length})` : "";
    document.querySelectorAll("nav.bottom button").forEach((b) => { if (b.dataset.v === state.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    const v = state.view;
    $("#chips").hidden = v === "tracker";
    const list = groups[v].filter(matches);
    const by = (a, b) => (b.fit_score ?? -1) - (a.fit_score ?? -1) || String(b.first_seen).localeCompare(String(a.first_seen));
    const titles = { jobs: ["New for you", "Posted in the last 24 hours, best fit first"], cvs: ["Approved", "Tailored CVs arrive here and by email"], tracker: ["Application tracker", ""], skipped: ["Skipped & expired", "Restore anything you change your mind about"] };
    const empty = { jobs: "Nothing to review. New jobs arrive after the next daily scan.", cvs: "Approve a job and its tailored CV shows up here.", tracker: "Applications appear here when you mark them or a confirmation email arrives.", skipped: "Nothing skipped yet." };
    let html = syncBar() + `<div class="section-head"><h2>${titles[v][0]}</h2><span>${titles[v][1]}</span></div>`;
    if ((v === "jobs" || v === "cvs") && list.length) html += `<div class="hint">Swipe a card left to skip it. Skipped jobs can be restored from Skipped.</div>`;
    if (v === "tracker") html += list.length ? trackerView(list) : `<div class="empty">${empty[v]}</div>`;
    else html += list.length ? `<div class="feed">${list.sort(by).map(card).join("")}</div>` : `<div class="empty">${state.q || state.filters.size ? "No jobs match these filters." : empty[v]}</div>`;
    $("#view").innerHTML = html;
  }

  function openSheet(id) {
    const j = state.jobs.find((x) => x.id === id);
    const sh = $("#sheet");
    if (!j) { sh.hidden = true; document.body.style.overflow = ""; return; }
    const s = Number.isFinite(j.fit_score) ? j.fit_score : null;
    const b = bucket(j);
    const li = (a) => (a || []).map((x) => `<li>${esc(x)}</li>`).join("");
    const tabs = [["analysis", "Analysis"], ["job", "Job description"], ["visa", "Sponsorship"]];
    const panel = state.tab === "job"
      ? `<div class="box"><div class="jd">${esc(j.jd_full || j.jd_summary || "The advert hasn't been read yet.")}</div></div>${j.url ? `<a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Open the full advert on Glassdoor</a>` : ""}`
      : state.tab === "visa"
      ? `<div class="checks">${checks(j).map((c) => `<div class="check"><div class="dot d-${c.c}">${{ good: "✓", warn: "!", bad: "✕", unk: "?" }[c.c]}</div><div><small>${esc(c.k)}</small><b>${esc(c.v)}</b>${c.d ? `<small>${esc(c.d)}</small>` : ""}</div></div>`).join("")}</div>
         <p style="font-size:.8rem;color:var(--muted);margin:0">A licensed sponsor can still decide not to sponsor a role. Check the job's occupation code going rate too.</p>`
      : `${j.verdict ? `<div class="box"><h3>Claude's take</h3><div>${esc(j.verdict)}</div></div>` : ""}
         ${(j.score_breakdown || []).length ? `<div class="box"><h3>How the ${s ?? ""}/100 is made up</h3><div class="breakdown">${j.score_breakdown.map((c) => {
            const pct = c.max ? Math.round((c.score / c.max) * 100) : 0;
            return `<div class="crit"><b>${esc(c.label)}</b><span class="pts">${c.score}/${c.max}</span><div class="bar"><i style="width:${pct}%;background:${pct >= 70 ? "var(--good)" : pct >= 40 ? "var(--warn)" : "var(--bad)"}"></i></div>${c.note ? `<small>${esc(c.note)}</small>` : ""}</div>`;
          }).join("")}</div>${j.confidence ? `<p class="conf">Confidence: <b>${esc(j.confidence)}</b>${j.confidence !== "high" ? " (scored before your master CV was uploaded, or from a short advert)" : ""}</p>` : ""}</div>` : ""}
         <div class="box pro"><h3>Why apply</h3><ul>${li(j.match_reasons) || "<li>No analysis yet.</li>"}</ul></div>
         <div class="box con"><h3>What could go wrong</h3><ul>${li(j.gaps) || "<li>Nothing flagged.</li>"}</ul></div>
         ${j.last_email ? `<div class="box"><h3>Latest email</h3><div>${esc(j.last_email)}</div></div>` : ""}
         <div class="links"><a class="btn ghost" href="${esc(chatUrl(j))}" target="_blank" rel="noopener">Chat with Claude about this job</a></div>`;
    let bar = "";
    if (b === "jobs") bar = `<button class="btn" data-skip="${esc(j.id)}">Skip</button>` + act("approve", j, "Go ahead: tailor CV", "primary");
    else if (b === "cvs") bar = (j.cv_url ? `<a class="btn" href="${esc(j.cv_url)}">Download CV</a>` : act("reopen", j, "Undo")) + act("applied", j, "Mark as applied", "primary");
    else if (b === "skipped") bar = `<button class="btn primary" data-restore="${esc(j.id)}">↩ Restore to Jobs</button>`;
    else bar = j.url ? `<a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open advert</a>` : "";
    sh.innerHTML = `<div class="sheet-top"><div class="wrap"><button class="back" data-close aria-label="Back">←</button><span class="ttl">${esc(j.company)}</span></div></div>
      <div class="hero"><div class="wrap">${logo(j.company)}
        <h2>${esc(j.title)}</h2><div class="co">${esc(j.company)} · ${esc(j.location || "")}</div>
        ${j.salary ? `<div class="pay">${esc(j.salary)}</div>` : ""}
        <div class="foot" style="display:flex;gap:6px;flex-wrap:wrap">${tagFor(j)}${j.easy_apply ? `<span class="tag">Easy Apply</span>` : ""}${j.posted_age ? `<span class="tag ${isFresh(j.posted_age) ? "good" : ""}">Posted ${esc(j.posted_age)}</span>` : ""}${APPLIED.includes(j.status) ? `<span class="status s-${esc(j.status)}">${esc(j.status)}</span>` : ""}</div>
        ${s != null ? `<div class="scorebar" style="--fitc:${fitColor(s)}"><b>${s}/100</b><div class="meter"><i style="width:${s}%"></i></div><span class="tag ${s >= 70 ? "good" : s >= 50 ? "warn" : "bad"}">${esc(recLabel[j.recommendation] || "")}</span></div>` : ""}
      </div></div>
      <div class="tabs"><div class="wrap" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join("")}</div></div>
      <div class="wrap panel">${panel}</div>
      ${bar ? `<div class="actionbar"><div class="wrap">${bar}</div></div>` : ""}`;
    sh.hidden = false; document.body.style.overflow = "hidden";
  }

  function route() {
    const m = location.hash.match(/^#job\/(.+)$/);
    if (m) openSheet(decodeURIComponent(m[1]));
    else { $("#sheet").hidden = true; document.body.style.overflow = ""; }
  }

  document.addEventListener("click", (ev) => {
    if (ev.target.closest("#refresh")) { refresh(true); return; }
    const sk = ev.target.closest("[data-skip]");
    if (sk) { skipLocal(sk.dataset.skip); return; }
    const rs = ev.target.closest("[data-restore]");
    if (rs) { restoreLocal(rs.dataset.restore); if (!$("#sheet").hidden) history.back(); return; }
    if (ev.target.closest("[data-sync]")) { toast("On GitHub, tap “Submit new issue”. It's saved a minute later."); return; }
    const o = ev.target.closest("[data-open]");
    if (o && o.dataset.dragged) { delete o.dataset.dragged; return; }
    if (o) { state.tab = "analysis"; location.hash = "job/" + o.dataset.open; return; }
    if (ev.target.closest("[data-close]")) { history.length > 1 ? history.back() : (location.hash = ""); return; }
    const tf = ev.target.closest("[data-tf]");
    if (tf) { state.tfilter = tf.dataset.tf; render(); return; }
    const t = ev.target.closest(".tab");
    if (t) { state.tab = t.dataset.tab; route(); return; }
    const n = ev.target.closest("nav.bottom button");
    if (n) { state.view = n.dataset.v; save("jd-view", state.view); render(); window.scrollTo(0, 0); return; }
    const c = ev.target.closest(".chip");
    if (c) { const f = c.dataset.f; state.filters.has(f) ? state.filters.delete(f) : state.filters.add(f); c.setAttribute("aria-pressed", String(state.filters.has(f))); render(); return; }
    const a = ev.target.closest("a[data-verb]");
    if (a) {
      state.pending[a.dataset.id] = { verb: a.dataset.verb, at: Date.now() }; save("jd-pending", state.pending);
      toast("On GitHub, tap “Submit new issue”. Job Desk updates a minute or two later.");
    }
  });
  document.addEventListener("keydown", (e) => { const o = e.target.closest && e.target.closest(".card[data-open]"); if (o && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); o.click(); } });

  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    const w = e.target.closest("[data-swipe]"); if (!w || e.button > 0) return;
    drag = { w, c: w.querySelector(".card"), x: e.clientX, y: e.clientY, dx: 0, on: false, pid: e.pointerId };
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) {
      if (dx < -12 && Math.abs(dx) > Math.abs(dy) * 1.4) { drag.on = true; drag.c.classList.add("dragging"); try { drag.c.setPointerCapture(e.pointerId); } catch (_) {} }
      else if (Math.abs(dy) > 12 || dx > 12) { drag = null; return; }
    }
    if (drag.on) { drag.dx = Math.min(0, dx); drag.c.style.transform = `translateX(${drag.dx}px)`; }
  });
  const endDrag = () => {
    if (!drag) return;
    const { w, c, dx, on } = drag; drag = null;
    if (!on) return;
    c.classList.remove("dragging"); c.dataset.dragged = "1"; setTimeout(() => delete c.dataset.dragged, 350);
    if (dx < -Math.min(120, w.offsetWidth * 0.33)) { c.style.transform = "translateX(-110%)"; c.style.opacity = "0"; setTimeout(() => skipLocal(w.dataset.swipe), 170); }
    else c.style.transform = "";
  };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });
  window.addEventListener("hashchange", route);

  async function getJSON(p) { const r = await fetch(`${p}?t=${Date.now()}`, { cache: "no-store" }); if (!r.ok) throw new Error(p); return r.json(); }
  async function refresh(manual) {
    const rb = $("#refresh"); rb.classList.add("spin");
    try {
      const [cfg, jobs, meta] = await Promise.all([getJSON("config/profile.json"), getJSON("data/jobs.json"), getJSON("data/meta.json").catch(() => ({}))]);
      Object.assign(state, { cfg, jobs, meta });
      const done = { approve: (j) => j.decision === "approved", skip: (j) => j.decision === "skipped", reopen: (j) => j.status === "new" };
      for (const [id, p] of Object.entries(state.pending)) {
        const j = jobs.find((x) => x.id === id);
        if (!j || (done[p.verb] ? done[p.verb](j) : j.status === p.verb) || Date.now() - p.at > 20 * 60 * 1000) delete state.pending[id];
      }
      save("jd-pending", state.pending);
      for (const id of Object.keys(state.local.skip)) { const j = jobs.find((x) => x.id === id); if (!j || isSkipped(j)) delete state.local.skip[id]; }
      for (const id of Object.keys(state.local.restore)) { const j = jobs.find((x) => x.id === id); if (!j || !isSkipped(j)) delete state.local.restore[id]; }
      saveLocal();
      $("#stamp").textContent = meta.last_scan ? `Scanned ${time12(meta.last_scan)}` : "Waiting for first scan";
      if (manual) toast(`Up to date · ${time12(new Date().toISOString())}`);
      const n = $("#notice"); if (meta.notice) { n.innerHTML = `<b>Heads up.</b> ${esc(meta.notice)}`; n.hidden = false; } else n.hidden = true;
      render(); route();
      rb.classList.remove("spin");
    } catch (e) { rb.classList.remove("spin"); $("#stamp").textContent = "Couldn't load data"; $("#view").innerHTML = `<div class="empty">Couldn't load your tracker. Check your connection and reload.</div>`; }
  }
  refresh();
  setInterval(() => { if (document.visibilityState === "visible" && Object.keys(state.pending).length) refresh(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
})();
</script>
</body>
</html>
